server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/pattern-decision;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/pattern-decision.access.log;
    error_log  /var/log/nginx/pattern-decision.error.log;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /intel {
        return 301 /intel/;
    }

    # Compatibility with the previous /intel/ public path.
    location /intel/ {
        rewrite ^/intel/(.*)$ /$1 last;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:html|json)$ {
        expires 1m;
        add_header Cache-Control "public, max-age=60";
        try_files $uri =404;
    }
}
